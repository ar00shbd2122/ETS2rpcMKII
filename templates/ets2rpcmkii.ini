; ============================================================
;  ETS2rpcMKII configuration  (v5.0)
;
;  This ini ships WITH every build. The plugin reads it from the
;  same folder as ets2rpcmkii.dll. HOT-RELOADED: save the file and
;  the presence updates within a couple of seconds. No game restart
;  needed. Delete the file to regenerate the defaults.
;
;  Full manual: DOCS.md (every state, every field, every token).
; ============================================================

[discord]
; Application ID from https://discord.com/developers/applications
application_id = 1553660903986045029

[presence]
; Toggle individual data on/off
show_speed       = 1
show_fuel        = 0
show_time        = 1
show_truck_badge = 1

[behaviour]
; metric or imperial (mi, mph, short tons)
units = metric
; Seconds between Discord updates (Discord throttles hard below ~5s)
update_interval = 5
; Seconds timed events (fine, tollgate, delivered) stay visible
event_hold = 30
; 24h clock (1) or 12h AM/PM (0) for the {time} token
use_24h = 1
; Speeding state: trigger at this % above the current speed limit
speeding_threshold_pct = 10
; Damage states: trigger at these wear/damage percentages
cargo_damage_threshold  = 25
chassis_wear_threshold  = 50

[countries]
; City-substring -> country tag for the {country} text tokens,
; and, ON YOUR OWN APPLICATION (see below), the flag art key for
; the badge when the value is a valid asset key.
; First match wins; the built-in table of ~970 cities (base map,
; DLCs and major map mods) runs after your entries, so mod-map
; cities work here too.
;dresden      = Germany          ; text only on the shared app
;dresden      = de               ; text + flag art on own app

[brands]
; Custom truck-brand art mappings. WORKS ONLY ON YOUR OWN
; APPLICATION (application_id different from the repo id):
; upload a logo in the Developer Portal, then map a case-
; insensitive substring of the truck brand to the asset key.
; On the shared repo application these lines are ignored.
;my_mod_truck = my_mod_logo
;renault      = renault_trucks
;
; CORE ART KEYS (own app): generic (unknown trucks), generic_c
; (unknown countries) and ets2 (big image). Missing core keys
; are simply not sent; nothing ghosts as a text line.

; ============ USING YOUR OWN DISCORD APPLICATION ============
; The repo application id above serves the shared, locked art
; set: 7 brands, generic, ets2. To unlock custom art:
;   1. Create an application at discord.com/developers/applications
;   2. Rich Presence -> Art Assets -> upload:
;        ets2        the official round ETS2 icon (core)
;        generic     fallback logo for unknown/modded trucks
;        generic_c   fallback art for unmapped countries
;        plus your brand logos and circular flags
;   3. Copy the application id into [discord] above
;   4. Map brands and countries in the sections here
; Rules the DLL enforces: an ini value is only sent if it is a
; valid asset key (1-32 chars, a-z 0-9 _ -) AND was uploaded in
; your portal. Invalid or missing keys are dropped, never ghosted.

; IMAGES ARE FIXED (see below). You customize text and buttons.

; ============================================================
;  HANDCRAFTED TEMPLATES - design every line yourself
; ============================================================
;  Fields:
;    state, details              the two text lines
;                                (details = upper line, state = lower)
;    button1_label, button1_url  first button (url must be http/s)
;    button2_label, button2_url  second button
;
;  IMAGES ARE FIXED, on purpose:
;    big image   = the official round ETS2 app icon
;    small badge = truck brand logo, hover shows
;                  truck name and speed
;                  (modded and unknown trucks: generic art)
;    set show_truck_badge = 0 to hide the badge
;    large_image / large_text / small_image / small_text lines
;    in the ini are ignored, so a broken key can never ghost a
;    mystery text line onto your profile.
;
;  Rules:
;    line absent   -> smart built-in default for that field
;    n/a           -> field cleared/skipped entirely
;    anything else -> used verbatim after token fill
;
;  Tokens (unknown ones vanish, so typos are safe):
;    {state} {details} {cargo} {mass} {dest} {src} {company}
;    {distance} {distance_unit} {distance_remaining} {driven}
;    {driven_tag} ready " ・ 128 km driven" this session, starts
;                  at zero with the game, vanishes while standing still
;    {driven} distance driven this session, e.g. 128 km
;    {driven_tag} ready " ・ 128 km driven"
;    {session} elapsed session time; {session_tag} ready " ・ 1h 24min in"
;    {speed} {speed_unit} {speed_limit} {over_limit}
;    {fuel} {fuel_l} {damage} {fine} {income} {eta} {eta_clock}
;    {truck} {brand} {model} {city} {game_version} {jobs_done}
;    {country} {country_code} (uppercase, e.g. RU) {country_emoji}
;    {country_tag} ready " (RU)", empty when country unknown,
;                  so a line never ends in bare parentheses
;    {src_tag} {dest_tag} {ferry_tag} ready " (FIN)" style ISO
;                  codes per city (route lines), empty when unknown
;    {ferry_from} {ferry_to} the real ferry/train crossing route
;    {time} {newline} {state_name}
;
;  Typos in KEY names (evnt_hold) and template states are reported
;  to game.log.txt as 'ini: ...' lines, once per config load.
;
;  Per-state sections [template.<key>] override single fields for
;  one state; unset fields fall back to [template].
;  Keys: main_menu, free_roam, delivery_active, delivery_complete,
;        paused, on_ferry, on_train, resting, got_fine, tollgate,
;        cargo_damaged, truck_damaged, speeding
; ============================================================

[template]
; ── Get on Steam button, like on official game profiles ──────
; NOTE: others see the buttons on your profile; Discord hides
; them from you (yes, even your own).
button1_label = Get on Steam
button1_url   = https://store.steampowered.com/app/227300/Euro_Truck_Simulator_2/
;button2_label = Join my Convoy
;button2_url   = https://discord.gg/truckersmp

[template.delivery_active]
state        = {src}{src_tag} → {dest}{dest_tag}{driven_tag}{session_tag}
details      = {cargo} ({mass}) ・ {distance} {distance_unit} ・ ETA {eta_clock}

[template.free_roam]
state        = Cruising through {country}{country_tag}
details      = {truck} ・ {speed} {speed_unit}

[template.speeding]
state        = {speed_limit} limit ・ {over_limit}% over
details      = {truck} ・ {speed} {speed_unit}

[template.delivery_complete]
state        = Earned {income}
details      = Delivered {cargo} to {dest}

[template.got_fine]
state        = Fined €{fine}
details      = Watch the road

[template.tollgate]
state        = → {dest}
details      = Toll booth passed

[template.cargo_damaged]
state        = {cargo} ・ {damage}% damaged
details      = Drive gently to {dest}

[template.truck_damaged]
state        = {truck} ・ {wear}% wear
details      = Find a garage soon

[template.on_ferry]
state        = On a ferry → {ferry_to}{ferry_tag}
details      = Crossing from {ferry_from}

[template.on_train]
state        = On a train → {ferry_to}{ferry_tag}
details      = Crossing by rail from {ferry_from}

[template.resting]
state        = Resting before {dest}
details      = Engine off ・ {time}

[template.paused]
state        = {src}{src_tag} → {dest}{dest_tag}
details      = Paused

[template.main_menu]
state        = Main Menu
details      = Planning the next haul

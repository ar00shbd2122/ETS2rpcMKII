; ============================================================
;  ETS2rpcMKII preset - DISTANCE
;
;  Focus: the journey. Kilometers left, ETA, elapsed time.
;  Images are fixed (game icon + brand logo), this preset
;  shapes the two text lines only.
;
;  Use: copy this file next to ets2rpcmkii.dll and rename it to
;  ets2rpcmkii.ini (or just edit it - it hot-reloads in-game).
; ============================================================

[discord]
application_id = 1553660903986045029

[presence]
show_speed       = 1
show_fuel        = 0
show_time        = 1
show_truck_badge = 1

[behaviour]
units           = metric
update_interval = 5
event_hold      = 30
use_24h         = 1

[template]
button1_label = Get on Steam
button1_url   = https://store.steampowered.com/app/227300/Euro_Truck_Simulator_2/

[template.delivery_active]
state        = {distance} {distance_unit} to {dest} ・ ETA {eta} min
details      = {cargo} ・ {speed} {speed_unit}

[template.free_roam]
state        = {distance} {distance_unit} ahead
details      = {truck} ・ {speed} {speed_unit}

[template.speeding]
state        = Making good time ・ {over_limit}% over
details      = {speed} {speed_unit} in a {speed_limit} zone

[template.resting]
state        = {eta} min of rest
details      = Back on the road at {time}

[template.paused]
state        = {distance} {distance_unit} left
details      = Resume to continue to {dest}

[template.main_menu]
state        = Main Menu
details      = Planning the next haul

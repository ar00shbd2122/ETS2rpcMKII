; ============================================================
;  ETS2rpcMKII preset - LOCATION
;
;  Focus: where you are. Country and city names in every line.
;  Images are fixed (game icon + brand logo), this preset
;  shapes the two text lines only.
;
;  Use: copy this file next to ets2rpcmkii.dll and rename it to
;  ets2rpcmkii.ini (or just edit it - it hot-reloads in-game).
; ============================================================

[discord]
application_id = 1553660903986045029

[presence]
show_speed       = 0
show_fuel        = 0
show_time        = 1
show_truck_badge = 1

[behaviour]
units           = metric
update_interval = 5
event_hold      = 30
use_24h         = 1

[countries]
; City-substring hints for the {country} text token. The built-in
; table already knows ~90 ETS2 cities; add yours below.
;dresden      = Germany
;calais       = France

[template]
button1_label = Get on Steam
button1_url   = https://store.steampowered.com/app/227300/Euro_Truck_Simulator_2/

[template.delivery_active]
state        = Hauling {cargo} from {src} to {dest}
details      = Driving through {city}{country_tag}

[template.free_roam]
state        = Exploring {country}
details      = Based out of {src} ・ {time}

[template.got_fine]
state        = Fined in {country}
details      = Watch the road

[template.tollgate]
state        = Toll booth passed
details      = Heading on to {dest}

[template.on_ferry]
state        = Ferry from {ferry_from} to {ferry_to}
details      = Country changes mid-route

[template.on_train]
state        = Rail freight from {ferry_from} to {ferry_to}
details      = Country changes mid-route

[template.resting]
state        = Overnight stop before {dest}
details      = Resting in {country}

[template.delivery_complete]
state        = Delivered in {dest}
details      = {income} earned, where to next?

[template.main_menu]
state        = Browsing the job market
details      = Picking the next country to visit

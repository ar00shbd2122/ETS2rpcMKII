; ============================================================
;  ETS2rpcMKII preset - MOST INFO
;
;  Focus: everything. Cargo, weight, fuel, damage, income.
;  Images are fixed (game icon + brand logo), this preset
;  shapes the two text lines only.
;
;  Use: copy this file next to ets2rpcmkii.dll and rename it to
;  ets2rpcmkii.ini (or just edit it - it hot-reloads in-game).
; ============================================================

[discord]
application_id = 1553660903986045029

[presence]
show_speed       = 1
show_fuel        = 1
show_time        = 1
show_truck_badge = 1

[behaviour]
units                   = metric
update_interval         = 5
event_hold              = 30
use_24h                 = 1
speeding_threshold_pct  = 5
cargo_damage_threshold  = 10
chassis_wear_threshold  = 30

[template]
button1_label = Get on Steam
button1_url   = https://store.steampowered.com/app/227300/Euro_Truck_Simulator_2/

[template.delivery_active]
state        = {mass} ・ {speed} {speed_unit} ・ {fuel}% fuel
details      = {cargo} to {dest} ・ {distance} {distance_unit} left

[template.free_roam]
state        = {truck} ・ {fuel}% fuel
details      = Exploring Europe ・ {time}

[template.speeding]
state        = {speed} {speed_unit} in a {speed_limit} zone
details      = {over_limit}% over, cameras are hungry

[template.cargo_damaged]
state        = {cargo} at {damage}% damage
details      = {distance} {distance_unit} to {dest} ・ drive gently

[template.truck_damaged]
state        = {truck} at {wear}% wear
details      = Garage recommended before {dest}

[template.got_fine]
state        = Fined €{fine}
details      = Balance impact logged

[template.tollgate]
state        = Toll booth passed
details      = {mass} rolling on to {dest}

[template.resting]
state        = {truck} parked for the night
details      = {fuel}% fuel ・ rest until {time}

[template.delivery_complete]
state        = {income} earned
details      = {cargo} delivered to {dest}

[template.main_menu]
state        = Main Menu
details      = Planning the next haul
